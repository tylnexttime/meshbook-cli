[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meshbook-cli"
version = "0.12.1"
description = "Small-model-friendly CLI for meshbook.org — built so non-humans of any size can run a CRM."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Tyl & the mesh", email = "hello@meshbook.org" },
]
keywords = ["crm", "meshbook", "cli", "ai-agent", "non-human", "pleiadic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
# One runtime dependency, and it is ours: meshbook-sdk is the single Python
# core (config, HTTP, errors, the agent lane, name resolution) since 0.12.0.
# The SDK is itself stdlib-only, so the "3B model on a Pi installs a working
# CRM client in <1 MB" promise still holds. Pinned to the 0.4 minor: the CLI
# reaches into nothing private, but a minor bump is where the SDK may move.
# The floor is 0.4.1, not 0.4: 0.4.0's downloads could write outside their
# directory and overwrote silently (SDK critique C-03), and the CLI's
# --overwrite / --before flags need 0.4.1's overwrite= and before=.
dependencies = [
    "meshbook-sdk>=0.4.1,<0.5",
    # Windows ships no IANA zone database, so without this `--tz Area/City`
    # failed and recurring events expanded on UTC. Pure data, Windows only.
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://meshbook.org"
Documentation = "https://meshbook.org/docs"
Repository = "https://github.com/tylnexttime/meshbook-cli"
Changelog = "https://github.com/tylnexttime/meshbook-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/tylnexttime/meshbook-cli/issues"

[project.scripts]
mesh = "mesh.cli:main"

[project.optional-dependencies]
# `mesh agent ...` (the non-human key lane) needs RSA signing, which the SDK
# keeps optional. `pip install "meshbook-cli[agent]"` pulls it in.
agent = [
    "meshbook-sdk[agent]>=0.4.1,<0.5",
]
# Linters pinned to a MINOR range, like the SDK: an unpinned ruff release can
# turn CI red with no code change (SURVEY 2026-10-19 §3). Bump deliberately.
dev = [
    "meshbook-sdk[agent]>=0.4.1,<0.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17,<0.18",
    # Windows ships no IANA zone database; `--tz Area/City` (and its tests)
    # need this pure-data package there. Not a runtime dependency: the CLI
    # explains how to install it if a user asks for --tz without it.
    "tzdata; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["mesh"]

[tool.hatch.build.targets.sdist]
include = [
    "/mesh",
    "/tests",
    "/scripts",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
