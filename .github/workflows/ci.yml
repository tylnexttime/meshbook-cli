name: CI

on:
  push:
    branches: [main]
    tags: ['v*']    # tag pushes (v0.12.0, ...) trigger the publish job below
  pull_request:
    branches: [main]

# meshbook-cli 0.12.1 depends on meshbook-sdk>=0.4.1,<0.5 from PyPI: the SDK
# must be published before this workflow can install the CLI.

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff, pinned minor)
        run: ruff check .

      - name: Contract - no direct HTTP in mesh/ (everything goes through meshbook-sdk)
        run: python scripts/cli_contract.py

      - name: Contract - every meshbook-sdk call exists in the pinned OpenAPI
        run: python scripts/contract_check.py --spec tests/contract/openapi.json --registry meshbook.endpoints

      - name: Test (records every SDK call the suite makes)
        env:
          MESH_CONTRACT_CALLS: build/contract-calls.json
        run: pytest -ra

      - name: Contract - every call the CLI suite made exists in the pinned OpenAPI
        run: python scripts/contract_check.py --spec tests/contract/openapi.json --calls build/contract-calls.json

      - name: Build (sdist + wheel)
        run: |
          pip install build
          python -m build

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/meshbook-cli
    permissions:
      id-token: write   # OIDC publishing - no PyPI token in repo secrets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The family has shipped a version that disagreed with itself three
      # times (DEV-DEBT §92 and siblings). A tag that does not match
      # pyproject's version must never publish.
      - name: Tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG pyproject=$VER"
          test "$TAG" = "$VER"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
